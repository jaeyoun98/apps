name: pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "7,27,47 * * * *" # jaybrief feed refresh; offset avoids top-of-hour congestion
    - cron: "30 22 * * *"     # 07:30 KST morning digest
    - cron: "30 3 * * *"      # 12:30 KST noon digest
    - cron: "30 9 * * *"      # 18:30 KST evening digest
    - cron: "0 12 * * *"      # 21:00 KST night digest
  workflow_dispatch:
    inputs:
      digest:
        description: Generate a jaybrief digest after refreshing the feed
        type: boolean
        default: true

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages-runtime
  cancel-in-progress: false

jobs:
  # jaybrief is the only app with a data pipeline. Deploy does not depend on this
  # succeeding: the runtime-data branch is only replaced after a successful run, so a
  # failure here simply ships the last good snapshot and never blocks another app.
  refresh-jaybrief:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Check out applications
        uses: actions/checkout@v4
        with:
          path: app
      - name: Check out runtime data
        uses: actions/checkout@v4
        with:
          ref: runtime-data
          path: runtime
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: app/jaybrief/requirements.txt
      - run: pip install -r requirements.txt
        working-directory: app/jaybrief
      - name: Restore runtime data
        run: cp -a ../../runtime/jaybrief/data/. data/
        working-directory: app/jaybrief
      - name: Refresh feed
        run: python scripts/fetch_feeds.py
        working-directory: app/jaybrief
      - name: Generate digest
        if: >-
          (github.event_name == 'workflow_dispatch' && inputs.digest) ||
          (github.event_name == 'schedule' && github.event.schedule != '7,27,47 * * * *')
        run: python scripts/make_digest.py
        working-directory: app/jaybrief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL || 'gemini-3.1-flash-lite' }}
      - name: Replace rolling runtime snapshot
        shell: bash
        run: |
          set -euo pipefail
          rm -rf jaybrief/data
          mkdir -p jaybrief/data
          cp -a ../app/jaybrief/data/. jaybrief/data/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A jaybrief/data
          old_commit=$(git rev-parse HEAD)
          tree=$(git write-tree)
          commit=$(printf 'Update runtime data\n' | git commit-tree "$tree")
          git push --force-with-lease=refs/heads/runtime-data:"$old_commit" \
            origin "$commit":refs/heads/runtime-data
        working-directory: runtime

  deploy:
    # always(): run even when refresh-jaybrief failed or was skipped (push events)
    needs: refresh-jaybrief
    if: always()
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out applications
        uses: actions/checkout@v4
        with:
          path: app
      - name: Check out runtime data
        uses: actions/checkout@v4
        with:
          ref: runtime-data
          path: runtime
      - name: Assemble site
        shell: bash
        env:
          # every app published at /<repo>/<app>/; _template is deliberately absent
          APPS: jaybrief jayfit
        run: |
          set -euo pipefail
          mkdir _site
          # Jekyll never runs for artifact deploys, but keep the marker so switching
          # back to branch-based Pages cannot silently drop underscore paths.
          touch _site/.nojekyll
          for a in $APPS; do
            test -d "app/$a" || { echo "::error::app directory app/$a is missing"; exit 1; }
            cp -a "app/$a" "_site/$a"
            # copy-then-prune, not an allowlist: a newly added asset ships automatically
            # instead of 404ing because someone forgot to update this workflow
            rm -rf "_site/$a"/{CLAUDE.md,README.md,scripts,tests,requirements.txt,.gitignore}
          done
          # jaybrief's generated JSON is not tracked on main; it comes from runtime-data
          rm -rf _site/jaybrief/data
          cp -a runtime/jaybrief/data _site/jaybrief/data
          echo "--- assembled tree ---"
          find _site -maxdepth 2 | sort
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
