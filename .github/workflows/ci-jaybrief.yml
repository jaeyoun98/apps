name: ci-jaybrief

# One CI workflow per app: on.push.paths is workflow-scoped, so a per-app file is what
# actually keeps one app's changes from running another app's checks.
on:
  push:
    paths:
      - "jaybrief/**"
      - ".github/workflows/ci-jaybrief.yml"
      # tests/test_workflows.py asserts on the deploy workflow's contents
      - ".github/workflows/pages.yml"
  pull_request:
    paths:
      - "jaybrief/**"
      - ".github/workflows/ci-jaybrief.yml"
      - ".github/workflows/pages.yml"

defaults:
  run:
    working-directory: jaybrief

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: jaybrief/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: node --check app.js && node --check sw.js
